name: Beta

# Four times a day, and whenever it's started by hand from the Actions tab: the next beta, built from what's on main and
# published with no approval. Not from dev, where work gathers before it reaches main.
# Merging dev into main is a beta's approval: main only changes through a pull request you merge, with Validate
# passed. Full releases stay with Release, behind your approval in the release environment.
#
# A run makes a beta only when something that ships has changed since the newest release, so most scheduled runs do
# nothing and finish in seconds. The number follows the newest release tag (b8, then b9).
#
# The scheduled run leaves a merge alone until main has been quiet for five minutes, so it doesn't cut a beta in the middle
# of a batch of merges: if a newer merge lands while it waits, it makes no beta and the next scheduled run takes them
# all. A run started by hand doesn't wait. It builds main as it is, and only main: started on another branch, it stops.
#
# The suites aren't run again. A merge's pull request ran Validate on GitHub's test merge with main, and its last job
# recorded that content by its git tree hash. When main's tree matches one recorded by a passing run from this
# repository, that content has been tested byte for byte. When it doesn't (main moved after the pull request's last
# run, so the merge combines changes never tested together), Validate runs here first, so nothing untested is ever
# built.
#
# GitHub may start a scheduled run late when it's busy, and stops scheduling them after 60 days with no activity in
# the repository, which a commit or starting one by hand sets going again.
on:
  schedule:
    # Four times a day at 17 past, the owner's call (2026-11-28): 00:17, 06:17, 12:17 and 18:17 UTC. Not on the hour,
    # because GitHub started only 1 of the first 15 on-the-hour runs: the start of the hour is where it delays and drops
    # scheduled runs. A dropped run is taken up by the next one.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

# One beta at a time, each numbered once the one before it is published, so two never take one number. A run started
# while one is under way waits its turn, oldest first: queue: max keeps every waiting run, where the default keeps
# only the newest and cancels the ones between. A run whose commit a newer release already holds makes no beta, so
# older code never goes out under a newer number.
concurrency:
  group: beta
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Next beta
    # Only main is ever built. A scheduled run is always main's; one started by hand can be pointed at any branch.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      title: ${{ steps.next.outputs.title }}
      ship: ${{ steps.next.outputs.ship }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for merges to stop arriving
        id: quiet
        # Started by hand, it builds main as it is, now.
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python3 scripts/quiet_main.py "$GITHUB_SHA" > "$RUNNER_TEMP/quiet"
          cat "$RUNNER_TEMP/quiet" >> "$GITHUB_OUTPUT"
          if grep -qx "newest=false" "$RUNNER_TEMP/quiet"; then
            echo "A newer merge landed on main while this waited, so no beta. The next run takes both." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Work out the version
        id: next
        if: ${{ steps.quiet.outputs.newest == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          python3 scripts/next_beta.py "$GITHUB_SHA" > "$RUNNER_TEMP/next"
          cat "$RUNNER_TEMP/next" >> "$GITHUB_OUTPUT"
          get() { sed -n "s/^$1=//p" "$RUNNER_TEMP/next"; }
          ship=$(get ship) version=$(get version) since=$(get since) included=$(get included)
          if [ "$ship" = true ]; then
            echo "Beta $version, built from main and published with no approval." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$included" = true ]; then
            echo "$since already includes what's on main, so no beta." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing that ships changed since $since, so no beta." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check this content already passed Validate
        id: tested
        if: ${{ steps.next.outputs.ship == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          tree=$(git rev-parse "$GITHUB_SHA^{tree}")
          # Only a run on this repository's own branches counts: a fork's pull request runs a workflow it can edit.
          found=$(gh api "repos/$GH_REPO/actions/artifacts?name=tested-tree-$tree&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)] | length")
          if [ "$found" -gt 0 ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "Validate already passed on tree $tree, so it isn't run again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "Tree $tree hasn't passed Validate (main moved after the pull request's last run), so it runs first." >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Validate
    needs: plan
    if: ${{ needs.plan.outputs.ship == 'true' && needs.plan.outputs.tested != 'true' }}
    uses: ./.github/workflows/validate.yml
    # A called workflow's jobs get no more than this, so it must cover every job's permissions in validate.yml.
    # scripts/check_workflows.py checks it.
    permissions:
      contents: read
      pull-requests: read

  beta:
    name: Build and publish
    needs: [plan, validate]
    # Runs after Validate passed here, or with Validate skipped because the content had already passed it.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ship == 'true' &&
      (needs.validate.result == 'success' || (needs.validate.result == 'skipped' && needs.plan.outputs.tested == 'true')) }}
    uses: ./.github/workflows/publish.yml
    # A called workflow's jobs get no more than this, so it must cover every job's permissions in publish.yml.
    # scripts/check_workflows.py checks it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.plan.outputs.version }}
      title: ${{ needs.plan.outputs.title }}
      ref: ${{ github.sha }}
      publish: true
      # No reviewer, betas only, main only: publish.yml refuses anything else that asks for it.
      environment: beta
