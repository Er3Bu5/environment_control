name: Release

# Run by hand from the Actions tab, on the web or the GitHub app. A dry run builds the zip and keeps it as a workflow
# artifact; a real run attests it and publishes a GitHub release, which is what HACS offers as an update.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as 0.1.0b1 (a beta) or 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Dry run: build only, publish nothing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$ ]] || { echo "::error::$VERSION isn't a version such as 0.1.0 or 0.1.0b1"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The version lives in one place: this input, stamped into the manifest at build, so CI never pushes to main.
      - name: Stamp the version
        run: |
          python3 - <<'PY'
          import json, os
          p = "custom_components/environment_control/manifest.json"
          m = json.load(open(p))
          m["version"] = os.environ["VERSION"]
          open(p, "w").write(json.dumps(m, indent=2) + "\n")
          PY
      - run: npm ci --ignore-scripts --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          EC_VERSION: ${{ inputs.version }}
      - run: python3 scripts/check_frontend_safety.py
      - name: Zip the integration
        run: |
          cd custom_components/environment_control
          find . -name __pycache__ -prune -exec rm -rf {} +
          zip -r -X "$GITHUB_WORKSPACE/environment_control.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -l environment_control.zip
          sha256sum environment_control.zip | tee environment_control.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment_control-${{ inputs.version }}
          path: |
            environment_control.zip
            environment_control.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    # Needs your approval in GitHub before it runs. Environments with required reviewers exist only on public repos
    # on the free plan, so a private repo can't publish at all: see the first step.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refuse while the repo is private
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::Releases go out only once the repo is public, behind the release environment's approval."
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: environment_control-${{ inputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: environment_control.zip
      - name: Publish the release
        run: |
          pre=""; [[ "$VERSION" == *b* ]] && pre="--prerelease"
          gh release create "v$VERSION" environment_control.zip environment_control.zip.sha256 \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes $pre
