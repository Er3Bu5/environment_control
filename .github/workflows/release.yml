name: Release

# Run by hand from the Actions tab, on the web or the GitHub app. A dry run builds the zip and keeps it as a workflow
# artifact; a real run attests it and publishes a GitHub release, which is what Home Assistant's Marketplace
# offers as an update. Betas normally come from the Beta workflow after each merge, so this is mostly for full releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as 0.1.0b1 (a beta) or 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Dry run: build only, publish nothing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The suites already ran when this commit reached main. A real release checks that run passed rather than running
  # them again; the release environment accepts main only, so the commit is one that arrived through a pull request.
  validated:
    name: Validated
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Check Validate passed on this commit
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/$GH_REPO/actions/workflows/validate.yml/runs?head_sha=$SHA&status=success&event=push&per_page=1" --jq '.total_count')
          [ "$passed" -gt 0 ] || { echo "::error::Validate hasn't passed on $SHA yet. Wait for it to finish on main, or release a commit it has passed."; exit 1; }

  publish:
    name: Build and publish
    needs: validated
    uses: ./.github/workflows/publish.yml
    # A called workflow's jobs get no more than this, so it must cover every job's permissions in publish.yml.
    # scripts/check_workflows.py checks it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      ref: ${{ github.sha }}
      publish: ${{ !inputs.dry_run }}
