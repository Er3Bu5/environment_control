name: Release

# Run by hand from the Actions tab, on the web or the GitHub app. A dry run builds the zip and keeps it as a workflow
# artifact; a real run attests it and publishes a GitHub release, which is what Home Assistant's Marketplace
# offers as an update. Betas normally come from the Beta workflow after each merge, so this is mostly for full releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as 0.1.0b1 (a beta) or 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Dry run: build only, publish nothing"
        type: boolean
        default: true
      title:
        description: "What this release is, in a few words. Home Assistant shows it after the tag"
        type: string
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The suites already ran on this content in its pull request, and Validate's last job recorded it by its git tree
  # hash. A real release checks that record rather than running them again; the release environment accepts main
  # only, so the commit is one that arrived through a pull request.
  validated:
    name: Validated
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check this content passed Validate
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$GH_REPO/commits/$SHA" --jq .commit.tree.sha)
          # Only a run on this repository's own branches counts: a fork's pull request runs a workflow it can edit.
          found=$(gh api "repos/$GH_REPO/actions/artifacts?name=tested-tree-$tree&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)] | length")
          [ "$found" -gt 0 ] || { echo "::error::Validate hasn't passed on this content (tree $tree). Run Validate on main by hand, then Release again."; exit 1; }

  publish:
    name: Build and publish
    needs: validated
    uses: ./.github/workflows/publish.yml
    # A called workflow's jobs get no more than this, so it must cover every job's permissions in publish.yml.
    # scripts/check_workflows.py checks it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      title: ${{ inputs.title }}
      ref: ${{ github.sha }}
      publish: ${{ !inputs.dry_run }}
