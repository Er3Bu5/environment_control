name: Validate

# Runs on each pull request, daily on main, and by hand. Not on a merge to main: the pull request's run already tested
# the merged content, and the last job records that content by its git tree hash, so Beta and Release can confirm
# exactly what they build passed here without running the suites a second time.
on:
  pull_request:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
  workflow_call:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: validate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The backend tests read the mock's sample room through node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install --no-input -r requirements_test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: python -m pytest -q
      - run: python scripts/check_backend_safety.py
      - run: python scripts/check_workflows.py

  frontend:
    name: Frontend and mock
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: no package gets to run code at install time.
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 ../scripts/check_frontend_safety.py ..
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The mock's own suite keeps the design reference working. It drives a browser it starts itself as `chromium`.
      - name: Mock suite
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(node -e 'import("@playwright/test").then(m => console.log(m.chromium.executablePath()))')" "$RUNNER_TEMP/bin/chromium"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cd ../design
          # GitHub's Ubuntu runners block the user namespaces Chromium's sandbox needs; Playwright turns it off there too.
          CHROMIUM_FLAGS="--no-sandbox" node vpd-browser-test.mjs "$PWD" | tee test-fixture.log
          grep -q ", 0 failed" test-fixture.log

  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-10-26

  marketplace:
    name: Marketplace
    # HA 2026.11 replaced HACS with its Marketplace. This checks the Marketplace's own rules, standard library only.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I scripts/check_marketplace.py

  secrets-and-privacy:
    name: Secrets and privacy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # On a pull request gitleaks lists the PR's commits to scan them, which needs this.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Scans the whole history, not just the latest commit.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # It would comment on the PR, which needs write access; a failed check is enough.
          GITLEAKS_ENABLE_COMMENTS: "false"
      - run: python3 scripts/check_privacy.py

  tested:
    name: Tested
    # Only once every check above passed. For a pull request the checkout is GitHub's test merge with main, so this is
    # the tree a merge lands when main hasn't moved since.
    needs: [backend, frontend, hassfest, marketplace, secrets-and-privacy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the tree that passed
        id: tree
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          echo "$tree" > tested-tree
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "Passed on tree $tree." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree
          retention-days: 30
          if-no-files-found: error
