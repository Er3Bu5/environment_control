version: 2
updates:
  # A release has to be two weeks old before it's proposed, so a hijacked one has time to be caught first.
  # Version updates go into dev like every other change. Security updates ignore target-branch and always go to the
  # default branch, main, so those wait for the owner.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: "dev"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: pip
    directory: /
    target-branch: "dev"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    target-branch: "dev"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
