<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment Control under a fake Home Assistant</title>
<style>
/* HA's own theme variables, which the panel element inherits. ?primary= replaces --primary-color, as a profile colour does. */
:root { --primary-color: #F44336; --primary-background-color: #FAFAFA; --card-background-color: #FFFFFF; --secondary-background-color: #E5E5E5;
  --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0, 0, 0, .12); }
html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
header { position: fixed; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #F44336; color: #fff; }
environment-control-panel { position: fixed; top: 36px; left: 0; right: 0; bottom: 0; }
#ha-overview { position: fixed; top: 36px; left: 0; right: 0; padding: 24px 16px; }
</style>
</head>
<body>
<header><strong>Home Assistant</strong><ha-sidebar></ha-sidebar></header>
<environment-control-panel></environment-control-panel>
<div id="ha-overview" hidden>Overview</div>
<script src="/design/sample-seed.js"></script>
<script src="/design/fake-ha.js"></script>
<script>
"use strict";
/* HA's sidebar: links inside an open shadow root, as HA's own list items render them. */
customElements.define("ha-sidebar", class extends HTMLElement {
  connectedCallback() {
    if (this.shadowRoot) return;
    this.attachShadow({ mode: "open" }).innerHTML = `<a href="#/lovelace" data-route="/lovelace" style="color:inherit">Overview</a> <a href="#/environment-control" data-route="/environment-control" style="color:inherit">Environment Control</a>`;
  }
});
const params = new URLSearchParams(location.search);
if (params.has("primary")) document.documentElement.style.setProperty("--primary-color", params.get("primary"));
const fakeHA = new FakeHA(SEED);
if (params.get("user") === "guest") { const hass = fakeHA.hass.bind(fakeHA); fakeHA.hass = () => ({ ...hass(), user: { is_admin: false } }); }
let panel = document.querySelector("environment-control-panel");
/* HA's router as its frontend has it: one click listener on the window turns a plain left click on a same-origin link
   into a page change, unless something cancelled the click first, and changing page takes the panel element off. */
let haRoute = "/environment-control";
history.replaceState(null, "", `${location.pathname}${location.search}#${haRoute}`);
function isNavigationClick(e) {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return undefined;
  const a = e.composedPath().find((n) => n.tagName === "A");
  if (!a || a.target || a.hasAttribute("download") || a.getAttribute("rel") === "external") return undefined;
  const url = new URL(a.href);
  if (url.origin !== location.origin) return undefined;
  e.preventDefault();
  return url.hash.slice(1) || "/";
}
function haNavigate(route) {
  if (route === haRoute) return;
  history.pushState(null, "", `${location.pathname}${location.search}#${route}`);
  haRoute = route;
  const onPanel = route === "/environment-control";
  document.querySelector("#ha-overview").hidden = onPanel;
  if (!onPanel && panel.isConnected) { fakeHA.detach(panel); panel.remove(); }
  if (onPanel && !panel.isConnected) {
    const next = document.createElement("environment-control-panel");
    document.querySelector("#ha-overview").before(next); panel = next; fakeHA.attach(next);
  }
}
window.addEventListener("click", (e) => { const route = isNavigationClick(e); if (route) haNavigate(route); });
function reopenPanel() {
  const next = document.createElement("environment-control-panel");
  fakeHA.detach(panel); panel.replaceWith(next); panel = next; fakeHA.attach(next);
}
</script>
<script type="module">
import "/custom_components/environment_control/frontend/host.js";
fakeHA.attach(panel);
</script>
</body>
</html>
