<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment Control under a fake Home Assistant</title>
<style>
/* HA's own theme variables, which the panel element inherits. ?primary= replaces --primary-color, as a profile colour does. */
:root { --primary-color: #F44336; --primary-background-color: #FAFAFA; --card-background-color: #FFFFFF; --secondary-background-color: #E5E5E5;
  --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0, 0, 0, .12);
  /* HA sets these from the device's safe areas; non-zero here so a panel that ignores them shows. */
  --safe-area-inset-top: 10px; --safe-area-inset-bottom: 20px; }
html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
header { position: fixed; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #F44336; color: #fff; }
/* As HA's ha-panel-custom styles itself for a panel it loads as a module: a block with safe-area padding and no height. */
ha-panel-custom { display: block; box-sizing: border-box; margin-top: 36px; padding-top: var(--safe-area-inset-top); padding-bottom: var(--safe-area-inset-bottom); }
#ha-overview { position: fixed; top: 36px; left: 0; right: 0; padding: 24px 16px; }
</style>
</head>
<body>
<header><strong>Home Assistant</strong><ha-sidebar></ha-sidebar></header>
<ha-panel-custom><environment-control-panel></environment-control-panel></ha-panel-custom>
<div id="ha-overview" hidden>Overview</div>
<script src="/design/sample-seed.js"></script>
<script src="/design/fake-ha.js"></script>
<script>
"use strict";
/* HA's sidebar: links inside an open shadow root, as HA's own list items render them. */
customElements.define("ha-sidebar", class extends HTMLElement {
  connectedCallback() {
    if (this.shadowRoot) return;
    this.attachShadow({ mode: "open" }).innerHTML = `<a href="#/lovelace" data-route="/lovelace" style="color:inherit">Overview</a> <a href="#/environment-control" data-route="/environment-control" style="color:inherit">Environment Control</a>`;
  }
});
const params = new URLSearchParams(location.search);
if (params.has("primary")) document.documentElement.style.setProperty("--primary-color", params.get("primary"));
const fakeHA = new FakeHA(SEED);
/* The backend's catalog, as the real one shapes it. One name is markup, to prove the frame draws it as text. */
const CATALOG = {
  devices: [
    { id: "d-board", name: "Environment board", area: "Garden", manufacturer: "Espressif", model: "PoE board", integration: "esphome", family: "ESPHome", link: "unknown", path: "local", hub: null,
      entities: [{ entity_id: "sensor.environment_board_air_temp", name: "Air temp", domain: "sensor", device_class: "temperature", unit: "°C", state: "24.1", category: null, area: null }] },
    { id: "d-plug", name: "Heater plug", area: "Garden", manufacturer: null, model: null, integration: "tuya_local", family: "Tuya Local", link: "wifi", path: "local", hub: null,
      entities: [{ entity_id: "switch.heater_plug", name: "Heater plug", domain: "switch", device_class: "outlet", unit: null, state: "off", category: null, area: null }] },
    { id: "d-bulb", name: "Tent light", area: "Veg", manufacturer: null, model: null, integration: "hue", family: "Philips Hue", link: "zigbee", path: "local", hub: "Hue bridge",
      entities: [{ entity_id: "light.tent_light", name: "Tent light", domain: "light", device_class: null, unit: null, state: "on", category: null, area: null }] },
    { id: "d-evil", name: '<img src=x onerror="window.pwned=1">', area: null, manufacturer: null, model: null, integration: "lg_thinq", family: "LG ThinQ", link: "unknown", path: "cloud", hub: null, entities: [] },
  ],
  entities: [{ entity_id: "input_boolean.lights_override", name: "Lights override", domain: "input_boolean", device_class: null, unit: null, state: "off", category: null, area: null, integration: "input_boolean", family: "Input boolean" }],
};
let catalogDown = params.get("catalog") === "fail";
const backendCommand = fakeHA.command.bind(fakeHA);
fakeHA.command = async (msg) => {
  if (!msg || msg.type !== "environment_control/catalog") return backendCommand(msg);
  if (catalogDown) fakeHA.fail("Catalog not ready");
  return JSON.parse(JSON.stringify(CATALOG));
};
if (params.get("user") === "guest") { const hass = fakeHA.hass.bind(fakeHA); fakeHA.hass = () => ({ ...hass(), user: { is_admin: false } }); }
let panel = document.querySelector("environment-control-panel");
/* HA opens its sidebar on hass-toggle-menu. */
let sidebarToggles = 0;
window.addEventListener("hass-toggle-menu", () => { sidebarToggles += 1; });
/* HA's router as its frontend has it. navigate() writes history first, then fires location-changed for the router to
   read the address; back and forward reach it as popstate. One click listener on the window turns a plain left click on
   a same-origin link into navigate(), unless something cancelled the click first. Changing page takes the panel off. */
let haRoute = "/environment-control";
history.replaceState(null, "", `${location.pathname}${location.search}#${haRoute}`);
function isNavigationClick(e) {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return undefined;
  const a = e.composedPath().find((n) => n.tagName === "A");
  if (!a || a.target || a.hasAttribute("download") || a.getAttribute("rel") === "external") return undefined;
  const url = new URL(a.href);
  if (url.origin !== location.origin) return undefined;
  e.preventDefault();
  return url.hash.slice(1) || "/";
}
function haNavigate(route, replace = false) {
  const url = `${location.pathname}${location.search}#${route}`;
  if (replace) history.replaceState(null, "", url); else history.pushState(null, "", url);
  window.dispatchEvent(new CustomEvent("location-changed", { detail: { replace } }));
}
function syncRoute() {
  const route = location.hash.slice(1) || "/";
  if (route === haRoute) return;
  haRoute = route;
  const onPanel = route === "/environment-control";
  document.querySelector("#ha-overview").hidden = onPanel;
  if (!onPanel && panel.isConnected) { fakeHA.detach(panel); panel.remove(); }
  if (onPanel && !panel.isConnected) {
    const next = document.createElement("environment-control-panel");
    document.querySelector("ha-panel-custom").append(next); panel = next; fakeHA.attach(next);
  }
}
window.addEventListener("location-changed", syncRoute);
window.addEventListener("popstate", syncRoute);
window.addEventListener("click", (e) => { const route = isNavigationClick(e); if (route && route !== haRoute) haNavigate(route); });
function reopenPanel() {
  const next = document.createElement("environment-control-panel");
  fakeHA.detach(panel); panel.replaceWith(next); panel = next; fakeHA.attach(next);
}
</script>
<script type="module">
import "/custom_components/environment_control/frontend/host.js";
/* HA sets narrow on a panel when its sidebar is hidden, once the panel's module has loaded, as here. */
if (params.has("narrow")) panel.narrow = true;
fakeHA.attach(panel);
</script>
</body>
</html>
