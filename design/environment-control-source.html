<title>Environment Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: Home Assistant's own shape. A top bar with view tabs, then tinted-icon tiles, each reading set on a line-and-dot band track. */
:root {
  --bg: #FAFAFA; --card: #FFFFFF; --tile: #F5F5F5; --line: #E0E0E0; --fg: #212121; --muted: #727272;
  --primary: #03A9F4; --on-primary: #FFFFFF;
  --temp: #FF9800; --hum: #2196F3; --vpd: #4CAF50; --sun: #FBC02D; --off: #BDBDBD;
  --above: #FF9800; --in: #4CAF50; --under: #7E57C2;
  --ok: #388E3C; --warn: #EF6C00; --crit: #D32F2F; --dead: #8A8A8A;
  --day: #FBC02D; --night: #DDE1EA; --band: #9E9E9E2E; --ideal: #4CAF5059; --tnom: #43A047; --tramp: #9E9E9E; --tcrit: #D32F2F; --ramp-text: #616161; --shade: #5C6BC014;
  --lhigh: #F1C40F; --llow: #000000; --v0: #B0BEC5; --v1: #A5D6A7; --v2: #FFCC80; --v3: #CE93D8; --vink: #212121;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111111; --card: #1C1C1C; --tile: #262626; --line: #2F2F2F; --fg: #E1E1E1; --muted: #9B9B9B; --off: #616161;
  --ok: #66BB6A; --warn: #FFB74D; --crit: #EF5350; --dead: #8F8F8F; --llow: #616161; --night: #2A2F3A; --band: #FFFFFF14; --ideal: #66BB6A55; --tnom: #66BB6A; --tramp: #757575; --tcrit: #EF5350; --ramp-text: #BDBDBD; --shade: #9FA8DA14;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111111; --card: #1C1C1C; --tile: #262626; --line: #2F2F2F; --fg: #E1E1E1; --muted: #9B9B9B; --off: #616161;
  --ok: #66BB6A; --warn: #FFB74D; --crit: #EF5350; --dead: #8F8F8F; --llow: #616161; --night: #2A2F3A; --band: #FFFFFF14; --ideal: #66BB6A55; --tnom: #66BB6A; --tramp: #757575; --tcrit: #EF5350; --ramp-text: #BDBDBD; --shade: #9FA8DA14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 24px; font-weight: 500; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 500; }
.muted { color: var(--muted); } .small { font-size: 13px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px 4px; font-size: 19px; }
.bar svg { width: 22px; height: 22px; fill: var(--muted); flex: none; }
.bar .sample { margin-left: auto; font-size: 12px; color: var(--muted); border: 1px dashed var(--off); border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
.tabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; border: 0; border-bottom: 2px solid transparent; background: none; padding: 8px 0; font-size: 14px; color: var(--muted); }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-current="page"] { color: var(--primary); border-bottom-color: var(--primary); }

main { padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); gap: 12px; align-items: start; }
.zone-card { text-align: left; color: inherit; font: inherit; }
.zone-card:hover { border-color: var(--primary); }

.ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 20%, transparent); }
.ic svg { width: 21px; height: 21px; fill: var(--c); }
.pill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid currentColor; }
.pill.ok { color: var(--ok); } .pill.low, .pill.high { color: var(--ramp-text); }
.pill.critlow, .pill.crithigh { color: #FFFFFF; background: var(--crit); border-color: var(--crit); }
.pill.dead { color: var(--dead); border-style: dashed; }
.pill.plain { color: var(--muted); border-color: var(--line); }
.pill.preview { color: var(--muted); border-style: dashed; }
.notice { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 14%, var(--card)); }
.notice.critical { background: color-mix(in srgb, var(--crit) 16%, var(--card)); }
.notice.fix { width: 100%; border: 0; justify-content: space-between; flex-wrap: nowrap; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.notice.fix:hover { outline: 1px solid var(--warn); }
.fixgo { flex: none; font-weight: 500; color: var(--primary); }
.fixlink[hidden] { display: none; }
.fixlink { border: 0; background: none; padding: 2px 0; font: inherit; color: var(--primary); cursor: pointer; text-align: left; }
.fixlink:hover { text-decoration: underline; }
.fixlink.small { font-size: 13px; }
.fixpill { background: none; cursor: pointer; font-family: inherit; }
.notice.calm { background: color-mix(in srgb, var(--ok) 12%, var(--card)); }

.period { display: flex; flex-direction: column; gap: 5px; }
.period-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 13px; }
.period-top strong { font-weight: 500; }
.lux { margin-left: 8px; color: var(--muted); }
.strip { position: relative; height: 8px; border-radius: 4px; background: var(--night); overflow: hidden; }
.strip i { position: absolute; top: 0; bottom: 0; background: var(--day); }
.strip b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); }

.track { position: relative; height: 14px; border-bottom: 1px solid var(--off); min-width: 0; }
.track .bandc { position: absolute; top: 3px; bottom: 0; left: 0; right: 0; background: var(--tcrit); }
.track .bandr { position: absolute; top: 3px; bottom: 0; background: var(--tramp); }
.track .tick { position: absolute; top: 3px; bottom: 0; width: 1px; background: var(--fg); }
.track .dot { position: absolute; bottom: -5px; width: 9px; height: 9px; margin-left: -6px; border-radius: 50%; border: 2px solid var(--card); box-sizing: content-box; background: var(--fg); }
.track .bandi { position: absolute; top: 3px; bottom: 0; background: var(--tnom); }
.track .dot.ok { background: var(--tnom); } .track .dot.low, .track .dot.high { background: var(--tramp); } .track .dot.critlow, .track .dot.crithigh { background: var(--crit); }

.rows { display: flex; flex-direction: column; gap: 12px; }
.mrow { display: grid; grid-template-columns: 36px 78px minmax(0, 1fr) 64px; gap: 8px; align-items: center; }
.mrow .t1 { font-size: 12px; color: var(--muted); }
.mrow .t2 { font-size: 17px; font-weight: 500; line-height: 1.15; white-space: nowrap; }
.mrow .t2 span { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
.mrow .pillcell { justify-self: end; }
.mrow .lspark { grid-column: 3 / -1; display: block; width: 100%; height: 34px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.lname { padding: 10px 12px 0; font-size: 13px; color: var(--muted); }
.lval { padding: 0 12px 4px; font-size: 22px; font-weight: 500; line-height: 1.2; }
.lval small { font-size: 13px; font-weight: 400; color: var(--muted); }
.lcard svg { display: block; width: 100%; flex: 1 1 60px; min-height: 60px; }
/* Tiles in one row share their row heights, so a longer note in one tile moves every track in the row down together. */
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-row: span 5; grid-template-rows: subgrid; gap: 8px; min-width: 0; align-items: start; }
.tiles > .lcard { grid-row: span 5; }
.tnotes { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.tile-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tile-top > div { min-width: 0; }
.tile .name { font-size: 13px; color: var(--muted); }
.tile .val { font-size: 22px; font-weight: 500; line-height: 1.1; }
.tile .val small { font-size: 13px; font-weight: 400; color: var(--muted); }
.tavg { font-size: 12px; color: var(--muted); }
.combine { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 8px; background: var(--tile); }
.inavg { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding-top: 2px; }
.range { display: flex; justify-content: space-between; gap: 2px; color: var(--muted); }
.range span { display: flex; flex-direction: column; align-items: center; font-size: 10px; }
.range b { font-size: 12px; font-weight: 500; color: var(--fg); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: none; padding: 3px 10px; border-radius: 14px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--primary) 18%, transparent); border-color: var(--primary); color: var(--fg); }

.map svg { display: block; width: 100%; height: auto; max-height: 460px; }
.map text { font-size: 15px; font-family: inherit; }
.map g[role="button"] { cursor: pointer; }
.key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 5px; }
.key i { width: 11px; height: 11px; display: inline-block; }
.detail { padding: 10px 12px; border-radius: 8px; background: var(--tile); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }

.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-size: 11px; fill: var(--muted); }
.chart svg { touch-action: pan-y; outline-offset: 2px; }
.chart-note { font-size: 13px; color: var(--muted); }
.chart-note:empty { display: none; }
table.cstats { font-size: 14px; font-variant-numeric: tabular-nums; }
.cstats th, .cstats td { padding: 5px 0 5px 10px; text-align: right; vertical-align: top; white-space: nowrap; }
.cstats th:first-child, .cstats td:first-child { padding-left: 0; text-align: left; font-size: 13px; }
.cstats td:first-child { white-space: normal; }
.cstats td:first-child i { display: inline-block; width: 11px; height: 2px; margin-right: 6px; vertical-align: middle; }
.cstats td .sub { font-size: 11px; }
.cstats tbody tr:last-child td { border-bottom: 0; }

.dev { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px; border-radius: 12px; background: var(--tile); }
.dev-text { flex: 1 1 150px; min-width: 0; }
.dev-name { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-size: 14px; font-weight: 500; }
.dev-sub { font-size: 12px; color: var(--muted); }
.dev-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
.devs { display: flex; flex-direction: column; gap: 8px; }
.mock { border: 1px dashed var(--off); border-radius: 8px; background: none; padding: 3px 8px; font-size: 12px; color: var(--muted); min-height: 28px; }
.mock:hover { color: var(--fg); border-color: var(--muted); }
.sw { width: 46px; display: inline-flex; align-items: center; justify-content: flex-start; }
.sw i { width: 16px; height: 16px; border-radius: 50%; background: var(--off); }
.sw.on { justify-content: flex-end; }
.sw.on i { background: var(--primary); }
.mock:disabled { opacity: .45; cursor: not-allowed; }
.mock:disabled:hover { color: var(--muted); border-color: var(--off); }
.cgroup { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
h3 { font-size: 15px; font-weight: 500; }
.ctl-reading { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }

.lrows { display: flex; flex-direction: column; gap: 8px; }
.lrow { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--tile); min-width: 0; }
.lrow-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; }
.lrow strong { font-weight: 500; }
.lfield { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lcell { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.lcell input { width: 72px; padding: 7px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); font: inherit; font-size: 14px; font-weight: 500; text-align: center; }
.lcell input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.lcell input[aria-invalid="true"] { border-color: var(--crit); box-shadow: 0 0 0 1px var(--crit); }
.lid { overflow-wrap: anywhere; }
.lstatus { font-size: 13px; color: var(--warn); }
.cal-how { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.lbasis { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--tile); min-width: 0; }
.lbasis strong { font-weight: 500; }
.lstatus:empty { display: none; }

.act { display: flex; flex-direction: column; }
.act-row { display: grid; grid-template-columns: 46px 36px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.act-row:first-child { border-top: 0; }
.act-time { font-size: 13px; color: var(--muted); }
.act-text { font-size: 14px; }
.act-by { font-size: 12px; color: var(--muted); }

.tbl-wrap { overflow-x: auto; }
.tbl-wrap th:last-child, .tbl-wrap td:last-child { padding-right: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td .sub { display: block; font-size: 12px; color: var(--muted); }
.tv { border: 1px dashed var(--off); border-radius: 6px; background: none; padding: 1px 6px; font-size: 13px; }

.task { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 14px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; padding-top: 0; }
.task > div:first-child { flex: 1 1 240px; min-width: 0; }
.btn { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 7px 12px; font-size: 14px; }
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 500; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.steps { display: flex; flex-wrap: wrap; gap: 4px 18px; list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
.steps li[aria-current="step"] { color: var(--primary); font-weight: 500; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 220px)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--tile); font-size: 15px; color: var(--fg); min-width: 0; width: 100%; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.sensor-opt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--tile); text-align: left; }
.sensor-opt[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.sensor-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px; min-width: 0; }
.now { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 10px 12px; border-radius: 8px; background: var(--tile); }
.now strong { font-weight: 500; }
.picklist { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pickwrap { border: 1px solid var(--line); border-radius: 8px; background: var(--tile); min-width: 0; }
.pickrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: 0; background: none; text-align: left; }
.pickwrap:has(.pickrow[aria-pressed="true"]) { border-color: var(--primary); }
.tick { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border: 1px solid var(--off); border-radius: 6px; font-size: 14px; }
.pickrow[aria-pressed="true"] .tick { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.pick-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pick-text strong { font-weight: 500; }
.ents { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px 42px; }
.ent { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.ent select { min-width: 0; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 13px; }
.review { display: flex; flex-direction: column; gap: 10px; }
.review strong { font-weight: 500; }
@media (max-width: 460px) { .ents { padding-left: 10px; } .ent { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.vgrid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 1fr); gap: 14px; align-items: start; }
.vchart svg { max-height: none; }
.vchart svg text { font-size: 12px; }
#vwrap { touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.vmain, .vside { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vtabs { display: flex; }
.vtabs button { flex: 1 1 auto; }
.vrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--tile); text-align: center; }
.vrow[data-on="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.vrow-name { grid-column: 1 / -1; padding: 0; border: 0; background: none; color: var(--fg); text-align: left; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
.vcell { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 10px; color: var(--muted); }
.vcell input { width: 100%; min-width: 0; padding: 6px 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); font: inherit; font-size: 14px; font-weight: 500; text-align: center; }
.vcell.vt input { color: var(--primary); }
.vcell.vlast { grid-column: 5; }
span.vrow-name { cursor: default; }
.vrow[data-vrow="light"] .vcell { grid-row: 2; }
.vnote { grid-row: 2; grid-column: 2 / -1; align-self: center; padding: 0 4px; font-size: 11px; line-height: 1.35; color: var(--muted); text-align: left; }
.vnote.vleft { grid-column: 1 / 5; }
.vcell input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.vcell input[aria-invalid="true"] { border-color: var(--crit); box-shadow: 0 0 0 1px var(--crit); }
/* iOS zooms the page when a focused field is under 16px. */
@media (pointer: coarse) { .vcell input, .lcell input { font-size: 16px; } }
/* Room to scroll the last row up while the keyboard is open. */
body.vtyping { padding-bottom: 70vh; }
@media (max-height: 500px) { body.vtyping .topbar { position: static; } }
/* The draft: pinned to the foot of the window, with what it holds and the way to apply it. Fixed, so it arriving mid tap can't move anything under a finger. */
.draftbar { position: fixed; z-index: 20; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(820px, calc(100vw - 32px)); display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 14px; background: var(--fg); color: var(--bg); box-shadow: 0 8px 24px #0000003D; }
.draftbar[hidden] { display: none; }
body.drafting:not(.vtyping) { padding-bottom: 96px; }

  if (!pressing && typedBox(e.target) && !typedBox(e.relatedTarget)) document.body.classList.remove("vtyping");
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.vin) { vCommit(e.target); return; }
  if (e.target.dataset.lin) { lCommit(e.target); return; }
  if (e.target.dataset.sin) { sCommit(e.target); return; }
  const m = ui.mapw;
  if (m) {
    const t = e.target.dataset;
    if (t.mmetric) { const [id, k] = t.mmetric.split(":"); m.choice[id] = m.choice[id] || {}; m.choice[id][k] = e.target.value; render(); }
    if (t.mrole) { m.roles[t.mrole] = e.target.value; render(); }
    if (t.mavg) { m.avg[t.mavg] = !e.target.checked; render(); }
    if (t.mclass) {
      /* Picks are kept per class, so changing class and back restores what was chosen. */
      const sensor = catalog().find((x) => x.id === t.mclass), kept = (m.kept ||= {})[sensor.id] ||= {};
      kept[classOf(m, sensor)] = m.choice[sensor.id]; m.cls[sensor.id] = e.target.value;
      if (kept[e.target.value]) m.choice[sensor.id] = kept[e.target.value]; else seedChoices(m, sensor);
      render();
    }
    if (t.mcombine) m.combine[t.mcombine] = e.target.value;
    if (t.msched) { const was = mapIssues(m).length; m[t.msched] = e.target.value; if (mapIssues(m).length !== was) render(); }
    return;
  }
  const w = ui.wiz; if (!w || e.target.id === "wiz-name") return; const v = e.target.value;
  const n = Number(v); if (!Number.isFinite(n) || n <= 0) return;
  if (e.target.id === "wiz-w") w.w = Math.min(100, n);
  if (e.target.id === "wiz-d") w.d = Math.min(100, n);
  if (e.target.id === "wiz-u") w.units = Math.min(200, Math.round(n));
  [w.rows, w.cols] = suggestGrid(w.units, w.w, w.d);
  if (e.target.id === "wiz-u") render();
});
document.addEventListener("pointerdown", (e) => {
  const wrap = e.target.closest && e.target.closest("#vwrap");
  if (!wrap || !ui.vpdw) return;
  vCommitActive();
  e.preventDefault(); wrap.setPointerCapture(e.pointerId); ui.vpdw.drag = true; vPointer(e, true);
});
document.addEventListener("pointermove", (e) => { if (ui.vpdw && ui.vpdw.drag) vPointer(e, false); chartPointer(e); });
document.addEventListener("pointerdown", chartPointer);
const endDrag = () => { if (ui.vpdw && ui.vpdw.drag) { ui.vpdw.drag = false; render(); } };
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
document.addEventListener("input", (e) => {
  if (e.target.id === "wiz-name" && ui.wiz) { ui.wiz.name = e.target.value; wizNameSync(e.target); }
  if (e.target.id === "map-q" && ui.mapw) { ui.mapw.q = e.target.value; $("#map-list").innerHTML = mapList(ui.mapw); }
  if (e.target.id === "map-lq" && ui.mapw) { ui.mapw.lq = e.target.value; $("#map-lights").innerHTML = lightRows(ui.mapw, zoneById(ui.mapw.id)); }
});
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawChart, 120); });
window.addEventListener("resize", vReveal);
if (window.visualViewport) window.visualViewport.addEventListener("resize", vReveal);
render();
</script>
